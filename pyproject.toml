[project]
name = "talking-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aman028", email = "aman_b210964mt@nitc.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "langchain-anthropic>=1.7.0",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "livekit-agents>=1.7.1",
    "livekit-api>=1.2.1",
    "livekit-plugins-deepgram>=1.7.1",
    "livekit-plugins-silero>=1.7.1",
    "pyngrok>=8.1.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "twilio>=9.11.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
talking-agent = "talking_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
